<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛️ Qwen Auditor Dashboard — VF-DCA 3.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e1a;
    color: #e4e6eb;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, #1a1f35 0%, #0f1424 100%);
    border: 1px solid #2a3148;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 24px; color: #fff; }
  .header .meta { font-size: 13px; color: #8b92a8; }
  .status-badge {
    background: #10b981;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: #141929;
    border: 1px solid #2a3148;
    border-radius: 10px;
    padding: 20px;
  }
  .kpi-card .label { font-size: 12px; color: #8b92a8; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-card .value { font-size: 28px; font-weight: 700; color: #fff; margin-top: 8px; }
  .kpi-card .sub { font-size: 12px; color: #8b92a8; margin-top: 4px; }
  .v3-section {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid #334155;
    border-left: 4px solid #f59e0b;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .v3-section h2 { color: #f59e0b; font-size: 16px; margin-bottom: 14px; }
  .v3-action {
    background: rgba(245, 158, 11, 0.08);
    border-left: 3px solid #f59e0b;
    padding: 10px 14px;
    margin-bottom: 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .v3-action strong { color: #fbbf24; }
  .portfolio-card {
    background: #141929;
    border: 1px solid #2a3148;
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .portfolio-header {
    background: #1a1f35;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2a3148;
  }
  .portfolio-header h3 { font-size: 16px; color: #fff; }
  .portfolio-header .p-id { color: #8b92a8; font-size: 13px; margin-left: 8px; }
  .portfolio-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 16px 20px;
    background: rgba(0,0,0,0.2);
  }
  .stat-item .stat-label { font-size: 11px; color: #8b92a8; text-transform: uppercase; }
  .stat-item .stat-value { font-size: 18px; font-weight: 600; color: #fff; margin-top: 4px; }
  .holdings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .holdings-table th {
    background: #0f1424;
    padding: 10px 12px;
    text-align: left;
    color: #8b92a8;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .holdings-table td { padding: 10px 12px; border-top: 1px solid #1f2538; }
  .holdings-table tr:hover { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-buy { background: rgba(16, 185, 129, 0.15); color: #10b981; }
  .badge-nobuy { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
  .badge-sell { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
  .badge-blocked { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
  .weight-bar { display: flex; align-items: center; gap: 8px; }
  .weight-bar .bar {
    flex: 1; height: 6px; background: #1f2538; border-radius: 3px;
    overflow: hidden; position: relative;
  }
  .weight-bar .fill {
    height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 3px;
  }
  .weight-bar .target-line {
    position: absolute; top: -2px; bottom: -2px; width: 2px; background: #f59e0b;
  }
  .audit-panel {
    background: #141929; border: 1px solid #2a3148; border-radius: 10px;
    padding: 20px; margin-top: 20px;
  }
  .audit-panel h2 { font-size: 16px; color: #fff; margin-bottom: 14px; }
  .audit-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;
  }
  .audit-item {
    background: rgba(16, 185, 129, 0.08); border-left: 3px solid #10b981;
    padding: 10px 14px; border-radius: 4px; font-size: 13px;
  }
  .audit-item .label { color: #8b92a8; font-size: 11px; }
  .audit-item .status { color: #10b981; font-weight: 600; margin-top: 2px; }
  .footer {
    text-align: center; padding: 20px; color: #8b92a8; font-size: 12px; margin-top: 20px;
  }
  .error-box {
    background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444;
    border-radius: 10px; padding: 24px; margin: 40px auto; max-width: 600px;
    text-align: center;
  }
  .error-box h2 { color: #ef4444; margin-bottom: 12px; }
  .error-box p { color: #e4e6eb; margin-bottom: 8px; }
  .error-box code {
    background: #1a1f35; padding: 2px 8px; border-radius: 4px;
    color: #fbbf24; font-family: monospace;
  }
  @media (max-width: 768px) {
    .portfolio-stats { grid-template-columns: repeat(2, 1fr); }
    .holdings-table { font-size: 11px; }
    .holdings-table th, .holdings-table td { padding: 6px 8px; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <div style="text-align:center;padding:40px;color:#8b92a8;">Loading dashboard...</div>
</div>

<script>
// ============================================================================
// VF-DCA 3.0 DASHBOARD - DEFENSIVE CODING VERSION
// ============================================================================

function fmt(n) {
  if (n === undefined || n === null) return '-';
  return new Intl.NumberFormat('th-TH').format(Math.round(n));
}

function safeArray(val) {
  return Array.isArray(val) ? val : [];
}

function safeNumber(val, fallback = 0) {
  return (typeof val === 'number' && !isNaN(val)) ? val : fallback;
}

function safeString(val, fallback = '-') {
  return (val !== undefined && val !== null && val !== '') ? String(val) : fallback;
}

// Load data.json with error handling
fetch('data.json')
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    return response.json();
  })
  .then(data => {
    try {
      render(data);
    } catch (err) {
      showError('Render Error', err.message);
    }
  })
  .catch(err => {
    showError(
      'Error loading data.json',
      err.message,
      [
        'ตรวจสอบว่าไฟล์ <code>data.json</code> อยู่ในโฟลเดอร์เดียวกับ <code>index.html</code>',
        'ตรวจสอบว่า GitHub Pages ถูก deploy แล้ว (รอ 1-2 นาทีหลังอัปโหลด)',
        'ตรวจสอบว่า JSON syntax ถูกต้อง (ไม่มี trailing comma, ใช้ double quotes)',
        'ลองเปิด Console (F12) เพื่อดู error เพิ่มเติม'
      ]
    );
  });

function showError(title, message, suggestions = []) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="error-box">
      <h2>❌ ${title}</h2>
      <p><strong>Message:</strong> ${message}</p>
      ${suggestions.length > 0 ? `
        <div style="text-align:left;margin-top:16px;padding:12px;background:rgba(0,0,0,0.3);border-radius:6px;">
          <p style="color:#fbbf24;font-weight:600;margin-bottom:8px;">🔧 วิธีแก้ไข:</p>
          ${suggestions.map(s => `<p style="margin:4px 0;">• ${s}</p>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function render(data) {
  // Validate required fields
  if (!data || typeof data !== 'object') {
    throw new Error('data.json is empty or invalid');
  }

  const metadata = data.metadata || {};
  const summary = data.summary || {};
  const v3Actions = safeArray(data.v3_strategic_actions);
  const portfolios = safeArray(data.portfolios);
  const audit = data.audit || {};

  // Build HTML
  const app = document.getElementById('app');
  app.innerHTML = `
    <!-- Header -->
    <div class="header">
      <div>
        <h1>🏛️ Qwen Auditor Dashboard</h1>
        <div class="meta">
          VF-DCA 3.0 · Parallel Run Mode · 
          Last Updated: ${safeString(metadata.last_updated, 'N/A')}
        </div>
      </div>
      <div class="status-badge">🟢 ${safeString(audit.audit_result, 'UNKNOWN')}</div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      ${renderKPI('Total Portfolio Value', '฿' + fmt(summary.total_portfolio_value), 'All Portfolios')}
      ${renderKPI('Monthly Budget', '฿' + fmt(summary.total_monthly_budget), 'P001-P004')}
      ${renderKPI('Total Execution', '฿' + fmt(summary.total_execution), 'This Cycle')}
      ${renderKPI('V3.0 Actions', safeNumber(summary.v3_actions_count), 'Strategic')}
      ${renderKPI('Remaining Cash', '฿' + fmt(summary.total_remaining), 'Policy: HOLD')}
    </div>

    <!-- V3 Strategic Actions -->
    ${v3Actions.length > 0 ? `
      <div class="v3-section">
        <h2>⚡ V3.0 STRATEGIC ACTIONS</h2>
        ${v3Actions.map(renderV3Action).join('')}
      </div>
    ` : ''}

    <!-- Portfolios -->
    ${portfolios.map(renderPortfolio).join('')}

    <!-- Audit Panel -->
    <div class="audit-panel">
      <h2>🛡️ AUDIT & INTEGRITY</h2>
      <div class="audit-grid">
        ${renderAuditItems(audit)}
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Source: Qwen Independent Auditor · Master: VF-DCA 3.0 v3.0 · 
      Data: ${safeString(metadata.data_date, 'N/A')}<br>
      Parallel Run with Gemini V2.2 · Independent Dashboard
    </div>
  `;
}

function renderKPI(label, value, sub) {
  return `
    <div class="kpi-card">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      <div class="sub">${sub}</div>
    </div>
  `;
}

function renderV3Action(a) {
  if (!a || typeof a !== 'object') return '';
  const icon = a.type === 'PROFIT_TAKING' ? '💰' : 
               a.type === 'GROUP_CAP_BLOCKED' ? '🛡️' : '🎯';
  let detail = '';
  if (a.type === 'PROFIT_TAKING') {
    detail = `${safeString(a.portfolio)} · ${safeString(a.ticker)}: Sold ${Math.abs(safeNumber(a.shares)).toLocaleString()} shares = +฿${fmt(a.cash_inflow)} — ${safeString(a.reason)}`;
  } else if (a.type === 'GROUP_CAP_BLOCKED') {
    detail = `${safeString(a.portfolio)} · ${safeString(a.ticker)}: Blocked — ${safeString(a.reason)}`;
  } else {
    const tickers = safeArray(a.tickers).join(', ');
    detail = `${safeString(a.portfolio)} · ${tickers}: ${safeString(a.reason)}`;
  }
  return `<div class="v3-action"><strong>${icon} ${safeString(a.type).replace(/_/g,' ')}</strong><br>${detail}</div>`;
}

function renderPortfolio(p) {
  if (!p || typeof p !== 'object') return '';
  const holdings = safeArray(p.holdings);
  const statusClass = safeString(p.status).includes('PASS') ? 'badge-buy' : 'badge-blocked';
  
  const holdingsHTML = holdings.length > 0 ? `
    <table class="holdings-table">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Value (฿)</th>
          <th>Weight Allocation</th>
          <th>Gap</th>
          <th>Action</th>
          <th>Actual Buy</th>
        </tr>
      </thead>
      <tbody>
        ${holdings.map(renderHolding).join('')}
      </tbody>
    </table>
  ` : '<div style="padding:30px;text-align:center;color:#8b92a8;">No holdings — DEFERRED</div>';

  return `
    <div class="portfolio-card">
      <div class="portfolio-header">
        <h3>
          ${safeString(p.name)} 
          <span class="p-id">${safeString(p.id)}</span>
          <span style="color:#8b92a8;font-size:12px;margin-left:8px;">${safeString(p.type)}</span>
        </h3>
        <span class="badge ${statusClass}">${safeString(p.status)}</span>
      </div>
      <div class="portfolio-stats">
        <div class="stat-item"><div class="stat-label">Portfolio Value</div><div class="stat-value">฿${fmt(p.value)}</div></div>
        <div class="stat-item"><div class="stat-label">Budget</div><div class="stat-value">฿${fmt(p.budget)}</div></div>
        <div class="stat-item"><div class="stat-label">Execution</div><div class="stat-value">฿${fmt(p.execution)}</div></div>
        <div class="stat-item"><div class="stat-label">Remaining</div><div class="stat-value">฿${fmt(p.remaining)}</div></div>
      </div>
      ${holdingsHTML}
    </div>
  `;
}

function renderHolding(h) {
  if (!h || typeof h !== 'object') return '';
  const gap = safeNumber(h.gap);
  const gapColor = gap > 0 ? '#10b981' : gap < 0 ? '#ef4444' : '#8b92a8';
  const action = safeString(h.action);
  const badgeClass = action === 'BUY' ? 'badge-buy' : 
                     action === 'NO BUY' ? 'badge-nobuy' :
                     action.includes('SELL') ? 'badge-sell' : 'badge-blocked';
  const weight = safeNumber(h.weight);
  const target = safeNumber(h.target);
  const barWidth = Math.min(weight, 50) * 2;
  const targetPos = Math.min(target, 50) * 2;
  const note = h.note ? `<br><small style="color:#8b92a8;">${safeString(h.note)}</small>` : '';

  return `
    <tr>
      <td><strong>${safeString(h.ticker)}</strong>${note}</td>
      <td>${fmt(h.value)}</td>
      <td>
        <div class="weight-bar">
          <div class="bar">
            <div class="fill" style="width:${barWidth}%;"></div>
            <div class="target-line" style="left:${targetPos}%;"></div>
          </div>
          <span style="font-size:11px;color:#8b92a8;">${weight.toFixed(1)}% / ${target.toFixed(0)}%</span>
        </div>
      </td>
      <td style="color:${gapColor};font-weight:600;">${gap > 0 ? '+' : ''}${gap.toFixed(2)}%</td>
      <td><span class="badge ${badgeClass}">${action}</span></td>
      <td>${safeNumber(h.actual_buy) > 0 ? '฿' + fmt(h.actual_buy) : '—'}</td>
    </tr>
  `;
}

function renderAuditItems(audit) {
  const items = Object.entries(audit)
    .filter(([k]) => k !== 'corrections')
    .map(([k, v]) => `
      <div class="audit-item">
        <div class="label">${k.replace(/_/g,' ').toUpperCase()}</div>
        <div class="status">✓ ${safeString(v)}</div>
      </div>
    `).join('');
  
  const corrections = safeArray(audit.corrections);
  const correctionsHTML = corrections.length > 0 ? `
    <div class="audit-item" style="grid-column:1/-1;border-left-color:#f59e0b;background:rgba(245,158,11,0.08);">
      <div class="label" style="color:#f59e0b;">CORRECTIONS LOGGED</div>
      <div style="color:#fbbf24;font-size:12px;margin-top:4px;">
        ${corrections.map(c => '• ' + safeString(c)).join('<br>')}
      </div>
    </div>
  ` : '';
  
  return items + correctionsHTML;
}
</script>
</body>
</html>
